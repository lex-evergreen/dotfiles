##### Core behavior #####

# Use a modern terminal definition
set -g default-terminal "tmux-256color"

# True color support
set -ga terminal-overrides ",*:Tc"

# Start window numbering at 1 (matches human expectations)
set -g base-index 1
setw -g pane-base-index 1

# New windows and panes inherit the current working directory
set -g default-command "${SHELL}"

# Preserve modifier keys in ghostty
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ",xterm-ghostty:extkeys"

##### Interaction #####

# Keep the default prefix (Ctrl-b) but make timing snappy
set -sg escape-time 0

# Faster redraws, less lag
set -g focus-events on

##### Windows feel like tabs #####

# Automatically rename windows based on running command
setw -g automatic-rename on
set -g set-titles on
set -g renumber-windows on

# Go to windows with the number of the window
bind-key 1 select-window -t :1
bind-key 2 select-window -t :2
bind-key 3 select-window -t :3
bind-key 4 select-window -t :4
bind-key 5 select-window -t :5
bind-key 6 select-window -t :6
bind-key 7 select-window -t :7
bind-key 8 select-window -t :8
bind-key 9 select-window -t :9

# Move windows left and right
bind -n C-Left  swap-window -d -t -1
bind -n C-Right swap-window -d -t +1
# Move through tmux sessions
bind -n C-Up switch-client -n
bind -n C-Down switch-client -p
# Create a new tmux session
bind n new-session -d
bind d detach

# Open new windows to the current window's path
bind c new-window -c "#{pane_current_path}"

# Start fish in new panes/windows
if-shell 'test -x /opt/homebrew/bin/fish' {
  set -g default-shell /opt/homebrew/bin/fish
  set -g default-command "/opt/homebrew/bin/fish --login"
}
if-shell 'test -x /home/linuxbrew/.linuxbrew/fish' {
  set -g default-shell /home/linuxbrew/.linuxbrew/fish
  set -g default-command "/home/linuxbrew/.linuxbrew/fish --login"
}

##### Visuals #####

# Status bar shows tabs
set -g status on
set -g status-position top
set -g status-interval 2
set -g status-left ""
set -g status-right ""
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "[#I:#W]"
# Status bar base colors (inactive)
set -g status-style "bg=colour232,fg=colour234"
# Inactive window tabs
setw -g window-status-style "bg=colour232,fg=colour236"
# Active window tab
setw -g window-status-current-style "bg=colour236,fg=colour240"

# Don’t flash or ring bells
set -g bell-action none
set -g visual-bell off

##### Sensible copy behavior #####

# Use macOS clipboard
set -g set-clipboard on

##### Safety #####

# Don’t kill tmux if a window closes
set -g detach-on-destroy off

##### Scrollback #####

# Scrollback with mouse
set -g mouse on
set -g history-limit 200000
# Use vim keys for copy-mode
setw -g mode-keys vi
# Make copy mode feel more like visual mode
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X begin-selection\; send-keys -X rectangle-toggle
bind-key -T copy-mode-vi V   send-keys -X select-line
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'awk '"'"'NR==1{buf=$0; next} {print buf; buf=$0} END{if (NR>0) printf "%s", buf}'"'"' | /usr/bin/pbcopy'
bind-key -T copy-mode-vi z send-keys -X scroll-middle
# Make ctrl+f only go down half a page, and don't use ctrl+d
bind-key -T copy-mode-vi C-f send-keys -X halfpage-down
unbind -T copy-mode-vi C-d
# Save full pane scrollback to a temp file (macOS) and copy the path to clipboard
bind-key j run-shell 'd="${TMPDIR:-/tmp}"; f="$d/tmux-pane-$(date +%Y%m%d-%H%M%S).txt"; tmux capture-pane -pS - > "$f"; printf "%s" "$f" | pbcopy; tmux display-message "Saved scrollback: $f (path copied)"'

# Smart close: only prompt if something other than a shell is running
unbind &
unbind w

bind w if -F '#{||:#{==:#{pane_current_command},fish},#{||:#{==:#{pane_current_command},zsh},#{==:#{pane_current_command},bash}}}' \
  'kill-window' \
  'confirm-before -p "kill-window #{window_name}? (y/n)" kill-window'
