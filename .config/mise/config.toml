[tools]

## Core Lang CLIs
dotnet = "latest"
rust = { version = "latest", components = ["rust-analyzer", "rust-src"] } # Installs rustup, toolchain via rustup, and rust-analyzer via rustup

## LSPs
# "dotnet:roslyn-language-server" = { version = "latest", prerelease = true } # use `dotnet tool install/update --global roslyn-language-server --prerelease`
"npm:typescript" = "latest"
# vscode-langservers-extracted provides:
#   vscode-eslint-language-server
#   vscode-json-language-server
#   vscode-html-language-server
"npm:vscode-langservers-extracted" = "latest"
ty = "latest"
ruff = "latest"
"npm:yaml-language-server" = "latest"
helm-ls = "latest"
lua-language-server = "latest"
terraform-ls = "latest"
# This doesn't work since they don't actually release the artifacts through GitHub. Using brew instead for now.
# "github:Kotlin/kotlin-lsp" = "latest"

## Formatters
"dotnet:CSharpier" = "latest"

